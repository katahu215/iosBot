name: Build iOS IPA for Sideloady

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Archive for iOS
        run: |
          xcodebuild archive \
            -scheme MyAwesomeApp \
            -destination "generic/platform=iOS" \
            -archivePath DerivedData/MyAwesomeApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          find DerivedData/MyAwesomeApp.xcarchive -name "*.app" -exec cp -r {} Payload/ \;

          if [ -z "$(ls -A Payload)" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi

          zip -r MyAwesomeApp-unsigned.ipa Payload
          rm -rf Payload DerivedData

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAwesomeApp-IPA
          path: MyAwesomeApp-unsigned.ipa
