name: Build iOS IPA for Sideloady

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Executable for iOS Device
        run: |
          swift build \
            --triple arm64-apple-ios \
            -Xswiftc -sdk -Xswiftc $(xcrun --sdk iphoneos --show-sdk-path) \
            -c release

      - name: Package into .ipa
        run: |
          mkdir -p Payload/MyAwesomeApp.app

          # Копируем скомпилированный бинарник Swift в бандл приложения
          cp .build/arm64-apple-ios/release/MyAwesomeApp Payload/MyAwesomeApp.app/MyAwesomeApp

          # Создаем корректный Info.plist
          cat << 'EOF' > Payload/MyAwesomeApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.example.MyAwesomeApp</string>
              <key>CFBundleName</key>
              <string>MyAwesomeApp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          # Упаковываем в .ipa
          zip -r MyAwesomeApp-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAwesomeApp-IPA
          path: MyAwesomeApp-unsigned.ipa
