name: Build Unsigned iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app bundle
        run: |
          xcodebuild \
            -project MySwiftApp.xcodeproj \
            -scheme MySwiftApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          # Копируем скомпилированное приложение в папку Payload для .ipa
          cp -r build/Build/Products/Release-iphoneos/MySwiftApp.app Payload/
          zip -r League17.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: League17-ipa
          path: League17.ipa
