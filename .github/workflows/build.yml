name: Build iOS IPA for Sideloady

on:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Archive for Real Device
        run: |
          xcodebuild archive \
            -scheme MyAwesomeApp \
            -destination "generic/platform=iOS" \
            -archivePath DerivedData/MyAwesomeApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r DerivedData/MyAwesomeApp.xcarchive/Products/Applications/*.app Payload/
          zip -r MyAwesomeApp-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAwesomeApp-IPA
          path: MyAwesomeApp-unsigned.ipa
