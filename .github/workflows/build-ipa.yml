name: Build IPA

on:
  workflow_dispatch: # Ключевой момент: разрешить ручной запуск

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project MyAwesomeApp.xcodeproj \
            -scheme MyAwesomeApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MyAwesomeApp.xcarchive" \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          cd "$RUNNER_TEMP/MyAwesomeApp.xcarchive/Products/Applications"
          mkdir -p Payload
          mv MyAwesomeApp.app Payload/
          zip -r "$RUNNER_TEMP/MyAwesomeApp.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyAwesomeApp-ipa
          path: ${{ runner.temp }}/MyAwesomeApp.ipa
